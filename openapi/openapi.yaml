openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  license:
    name: UNLICENSED
    url: https://choosealicense.com/no-permission/
  description: >-
    Contract for the Marketplace course project. Money is always in integer
    cents. Every 4xx error is returned as application/problem+json (RFC 7807).
security: []
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: '3000'
        description: Matches the PORT environment variable of the server.
tags:
  - name: products
    description: Catalogue of products for sale.
  - name: orders
    description: Customer orders placed for products.
  - name: health
    description: Service health.
  - name: sessions
    description: Server-side sessions kept in Redis with a rolling TTL.
  - name: auth
    description: Login, refresh-token rotation with reuse detection, logout.
  - name: files
    description: >-
      Two-step uploads straight to the object storage (presigned URLs, multipart with resume) and
      short-lived download links. The API authorizes and records; it is never in the data path.

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and database connectivity check
      responses:
        '200':
          description: Service and database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value: { status: ok, db: ok, uptime: 42 }
        '503':
          description: Database is unreachable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products (cursor-paginated)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                firstPage:
                  summary: First page, more pages follow
                  value:
                    items:
                      - { id: 1, name: Keyboard, price_cents: 259900, stock: 10 }
                      - { id: 2, name: Mouse, price_cents: 89900, stock: 10 }
                    next_cursor: Mg
                lastPage:
                  summary: Last page
                  value:
                    items:
                      - { id: 3, name: Monitor, price_cents: 1249900, stock: 10 }
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create a product
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client-generated unique key (e.g. UUID) that makes the request safe to retry.
            Repeating the request with the same key and the same body returns the same
            response as the first attempt (same status and body) with the header
            `Idempotency-Replay: true` and does not create a second resource.
            Reusing the key with a different body is rejected with 422.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product created (or replayed for a repeated Idempotency-Key).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                created:
                  value: { id: 4, name: Cable, price_cents: 19900, stock: 10 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The referenced seller does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [products]
      operationId: getProduct
      summary: Get a product by id
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
              examples:
                product:
                  value: { id: 1, name: Keyboard, price_cents: 259900, stock: 10, sold: 2 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders (cursor-paginated)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              examples:
                lastPage:
                  summary: Single page, no more pages
                  value:
                    items:
                      - id: 1
                        user_id: 1
                        items:
                          - { product_id: 1, quantity: 2 }
                        total_cents: 519800
                        status: paid
                        created_at: '2026-09-02T09:49:29.909Z'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order
      description: >-
        Creates an order from the given items in one transaction: stock of every
        item is decremented atomically, the total (computed server-side from current
        prices, in integer cents) is charged from the user's balance, and the order
        is stored as `paid`. Not enough stock or balance rolls the whole order back.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client-generated unique key (e.g. UUID) that makes the request safe to retry.
            Repeating the request with the same key and the same body returns the same
            response as the first attempt (same status and body) with the header
            `Idempotency-Replay: true` and does not create a second resource.
            Reusing the key with a different body is rejected with 422.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created (or replayed for a repeated Idempotency-Key).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                created:
                  value:
                    id: 1
                    user_id: 1
                    items:
                      - { product_id: 1, quantity: 2 }
                    total_cents: 519800
                    status: paid
                    created_at: '2026-09-02T09:49:29.909Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The user or one of the referenced products does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Not enough stock for one of the items, or the user's balance does not cover the total.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order by id
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                order:
                  value:
                    id: 1
                    user_id: 1
                    items:
                      - { product_id: 1, quantity: 2 }
                    total_cents: 519800
                    status: paid
                    created_at: '2026-09-02T09:49:29.909Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Move an order to the next lifecycle status
      description: >-
        Applies one transition of the order lifecycle inside a transaction (the order row is locked
        with FOR UPDATE). A successful change publishes an `order.status` event to the WebSocket room
        `orders:{id}` and to the SSE stream of this order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStatus'
            examples:
              ship:
                value: { status: shipped }
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The order with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The transition is not allowed from the current status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [orders]
      operationId: streamOrderEvents
      summary: Server-sent events with status changes of an order
      description: >-
        Long-lived `text/event-stream`, available only to the owner of the order (bearer token). The
        stream opens with `retry: 1000`; every status change arrives as `event: order.status` with a
        per-order `id:` that grows by one and an OrderStatusEvent JSON in `data:`; a `: ping` comment
        every 15 seconds keeps idle connections alive. Events are stored in the `order_events` table, so
        the numbering survives restarts and a client that reconnects with `Last-Event-ID` first receives
        the events it missed.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Id of the last event the client has seen; buffered events with greater ids are replayed first.
          schema:
            type: integer
            minimum: 0
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: order.status
                id: 4
                data: {"id":4,"orderId":11,"status":"delivered","previous":"out_for_delivery","at":"2026-10-11T19:00:00.000Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The order belongs to another user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session for a user
      description: >-
        Creates a server-side session in Redis for the authenticated user, with a rolling TTL. The id
        returned here is sent back in the `X-Session-Id` header; every request carrying it extends the TTL.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                created:
                  value:
                    session_id: 3f2a2d8e-5e1b-4b1a-9f1e-0c6b7d2a9e11
                    user_id: 1
                    expires_in: 1800
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /sessions/me:
    get:
      tags: [sessions]
      operationId: getCurrentSession
      summary: Read the current session and extend its TTL (the session id is the credential here)
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          description: Session id returned by `POST /sessions`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session is alive; its TTL has just been reset to the full value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                alive:
                  value:
                    session_id: 3f2a2d8e-5e1b-4b1a-9f1e-0c6b7d2a9e11
                    user_id: 1
                    expires_in: 1800
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unknown or expired session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for an access/refresh token pair
      description: >-
        The access token is a short-lived ES256 JWT (10 minutes); the refresh token is an opaque random
        string stored only as an HMAC hash. Every login starts a new refresh-token family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token and issue a new pair
      description: >-
        The presented refresh token is marked used and a new pair is issued inside the same family.
        Presenting an already used token is treated as theft: the whole family is revoked and every
        access token of that family stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair; the old refresh token is dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh-token family and deny the current access token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out; the refresh family is revoked and the access token is denied until it expires.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /uploads/intent:
    post:
      tags: [files]
      operationId: createUploadIntent
      summary: Step 1 of an upload — reserve an object key and get presigned URLs
      description: >-
        The server generates the object key (`uploads/{userId}/{uuid}.{ext}`, the extension comes from the
        allow-listed `content_type`, the client's `filename` never reaches the key), stores a `pending` row and
        returns presigned URLs valid for `expires_in` seconds: one PUT for small files, or a multipart plan with
        one URL per part for files above the multipart threshold. The client then PUTs the bytes straight to the
        storage and calls `commit`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client-generated unique key: a double tap on "upload" with the same key returns the same intent
            (same `file_id`, same URLs) with `Idempotency-Replay: true` instead of reserving a second object.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntent'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Intent recorded (or replayed for a repeated Idempotency-Key).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPlan'
              examples:
                single:
                  value:
                    file_id: 7c5c3f52-9e3a-4b48-9d7e-2b7f1e8a0c11
                    key: uploads/1/7c5c3f52-9e3a-4b48-9d7e-2b7f1e8a0c11.png
                    expires_in: 300
                    upload:
                      type: single
                      url: http://localhost:9000/marketplace-files/uploads/1/7c5c3f52-9e3a-4b48-9d7e-2b7f1e8a0c11.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=300&X-Amz-Signature=...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /uploads/{id}/parts:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: listUploadParts
      summary: Resume a multipart upload — which parts the storage already has, fresh URLs for the rest
      description: >-
        Asks the storage (ListParts) which parts arrived and returns presigned URLs only for the missing ones,
        so a client that crashed mid-upload re-sends the missing parts instead of the whole file.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Uploaded parts and URLs for the missing ones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadParts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /uploads/{id}/commit:
    parameters:
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [files]
      operationId: commitUpload
      summary: Step 2 of an upload — verify the object exists and mark the file completed
      description: >-
        For a multipart upload completes it from the parts the storage lists. Then HeadObject: the object must
        exist and its size must match the declared one, otherwise `409` and the file stays `pending`.
        Committing an already completed file returns it again.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The file is completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: downloadFile
      summary: Redirect to a one-minute presigned download URL
      description: >-
        Presigned URLs cannot be revoked, so they are never handed out for long: the API checks the owner on
        every request and answers `302` to a URL that lives 60 seconds.
      security:
        - bearerAuth: []
      responses:
        '302':
          description: Follow `Location` to download the bytes straight from the storage.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Maximum number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque pagination token taken from `next_cursor` of the previous page.
        Do not construct or parse it on the client. Omit it to get the first page.
      schema:
        type: string
        minLength: 1

  headers:
    IdempotencyReplay:
      description: Present and `true` when the response was replayed from a previous request with the same Idempotency-Key.
      schema:
        type: boolean

  responses:
    BadRequest:
      description: The request violates the contract (missing header, invalid body or parameters).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request is valid but the resource is not in a state that allows it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: The Idempotency-Key was already used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired, revoked or tampered access token; refresh the session and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but this user may not perform the operation on this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, db, uptime]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [ok]
        uptime:
          type: integer
          description: Seconds since the process started.

    Problem:
      type: object
      description: Error payload as defined by RFC 7807.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type.
        title:
          type: string
          description: Short, human-readable summary of the error type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI of the request that produced the error.

    Product:
      type: object
      additionalProperties: false
      required: [id, name, price_cents, stock]
      properties:
        id:
          type: integer
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
          description: Price in integer cents.
        stock:
          type: integer
          minimum: 0
          description: Units available for sale; decremented atomically by checkout.

    CreateProduct:
      type: object
      additionalProperties: false
      required: [seller_id, name, price_cents]
      properties:
        seller_id:
          type: integer
          minimum: 1
          description: Id of the user who sells the product.
        name:
          type: string
          minLength: 1
          maxLength: 200
        price_cents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
          default: 0
          description: Initial units available for sale.

    ProductCard:
      type: object
      additionalProperties: false
      required: [id, name, price_cents, stock, sold]
      properties:
        id:
          type: integer
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
          description: Price in integer cents.
        stock:
          type: integer
          minimum: 0
          description: Units available for sale; decremented atomically by checkout.
        sold:
          type: integer
          minimum: 0
          description: Units sold across non-cancelled orders; served from the Redis cache (TTL 300-360 s).

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: ES256 JWT with `sub`, `role`, `fid` (refresh family), `jti`, `exp`.
        refresh_token:
          type: string
          description: Opaque random string; single use, rotated on every refresh.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds.

    Session:
      type: object
      additionalProperties: false
      required: [session_id, user_id, expires_in]
      properties:
        session_id:
          type: string
          format: uuid
        user_id:
          type: integer
        expires_in:
          type: integer
          description: Seconds until the session expires if it is not read again.

    ProductPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page; null when there are no more pages.

    OrderItem:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1

    CreateOrder:
      type: object
      additionalProperties: false
      required: [user_id, items]
      properties:
        user_id:
          type: integer
          minimum: 1
          description: Id of the user placing the order.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    Order:
      type: object
      additionalProperties: false
      required: [id, user_id, items, total_cents, status, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          minimum: 0
          description: Order total in integer cents.
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum: [pending, paid, processing, shipped, out_for_delivery, delivered, cancelled]
      description: >-
        Lifecycle: pending → paid → processing → shipped → out_for_delivery → delivered;
        cancelled is allowed from pending, paid and processing. delivered and cancelled are final.

    ChangeOrderStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    OrderStatusEvent:
      type: object
      additionalProperties: false
      required: [id, orderId, status, previous, at]
      description: Payload of an `order.status` event (SSE `data:` line and the WebSocket message).
      properties:
        id:
          type: integer
          minimum: 1
          description: Per-order event number; grows by one with every status change and is persisted, so it never restarts from 1.
        orderId:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        previous:
          $ref: '#/components/schemas/OrderStatus'
        at:
          type: string
          format: date-time

    OrderPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page; null when there are no more pages.
    UploadIntent:
      type: object
      required: [filename, content_type, size]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Informational only; it is stored nowhere near the object key.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf, application/octet-stream]
          description: Allow-listed MIME type; it also decides the key extension.
        size:
          type: integer
          minimum: 1
          maximum: 5497558138880
          description: Declared size in bytes; commit refuses an object of a different size.
    UploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        url:
          type: string
          description: Presigned UploadPart URL; PUT the bytes of this part here.
    UploadPlan:
      type: object
      required: [file_id, key, expires_in, upload]
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
          description: Server-generated object key `uploads/{userId}/{uuid}.{ext}`.
        expires_in:
          type: integer
          description: Seconds the presigned URLs stay valid.
        upload:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [single, multipart]
            url:
              type: string
              description: '`single` only: PUT the whole body here with the declared Content-Type.'
            upload_id:
              type: string
              description: '`multipart` only.'
            part_size:
              type: integer
              description: '`multipart` only: bytes per part, the last part may be shorter.'
            size:
              type: integer
            parts:
              type: array
              items:
                $ref: '#/components/schemas/UploadPart'
    UploadParts:
      type: object
      required: [file_id, key, upload_id, part_size, size, expires_in, uploaded, parts]
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
        upload_id:
          type: string
        part_size:
          type: integer
        size:
          type: integer
        expires_in:
          type: integer
        uploaded:
          type: array
          description: Parts the storage already holds (ListParts).
          items:
            type: object
            required: [part_number, size, etag]
            properties:
              part_number:
                type: integer
              size:
                type: integer
              etag:
                type: string
        parts:
          type: array
          description: Fresh presigned URLs for the parts that are still missing.
          items:
            $ref: '#/components/schemas/UploadPart'
    StoredFile:
      type: object
      required: [id, key, owner_id, content_type, size, status, etag, created_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        owner_id:
          type: integer
        content_type:
          type: string
        size:
          type: integer
        status:
          type: string
          enum: [pending, completed]
        etag:
          type: string
          nullable: true
          description: Storage ETag; a multipart object has the `-N` suffix and is not the MD5 of the file.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
