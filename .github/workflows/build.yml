name: build

on:
  workflow_call:
    inputs:
      sha:
        description: Commit the image is built from and tagged with
        required: true
        type: string
    outputs:
      image-ref:
        description: Full reference with the commit tag (for people)
        value: ${{ jobs.image.outputs.image-ref }}
      digest:
        description: Content digest of the pushed image (what gets deployed)
        value: ${{ jobs.image.outputs.digest }}
      gate-scan-exit:
        description: Exit code of the scan gate
        value: ${{ jobs.image.outputs.gate-scan-exit }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    outputs:
      image-ref: ${{ env.REGISTRY_IMAGE }}:${{ inputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
      gate-scan-exit: ${{ steps.scan.outputs.exit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build-time secret, a decoy that demo:image then looks for in the layers and history
        run: printf 'ci-decoy-npm-token' > .npm_token
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:${{ inputs.sha }}
          secret-files: npm_token=.npm_token
      - name: One line per build in this run
        run: echo "$(date -u +%FT%TZ) run=${{ github.run_id }} ${{ env.REGISTRY_IMAGE }}:${{ inputs.sha }} ${{ steps.build.outputs.digest }}" >> build.log
      - name: Take the image back from the registry by digest
        run: |
          docker pull "$REGISTRY_IMAGE@${{ steps.build.outputs.digest }}"
          docker tag "$REGISTRY_IMAGE@${{ steps.build.outputs.digest }}" marketplace-api:local
      - run: npm run demo:image
      - name: Step 4, scan gate (fixable CRITICAL and HIGH findings must not exceed the threshold)
        id: scan
        env:
          SCAN_MAX: '20'
        run: |
          code=0; npm run scan || code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-log
          path: build.log
