name: deliver

on:
  workflow_call:
    inputs:
      environment:
        description: Name of the environment the cluster in this job stands for
        required: true
        type: string
      image-ref:
        required: true
        type: string
      digest:
        required: true
        type: string
      gate-scan-exit:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      evidence-name:
        required: true
        type: string
      cost-approved:
        description: The pull request carries the bypass label of the cost gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      SKIP_VAULT: '1'
      ROLLOUT_MIN_REQUESTS: '2000'
      EVIDENCE_DIR: pipeline-evidence
      IMAGE_BY_DIGEST: ghcr.io/${{ github.repository }}@${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm --prefix infra ci && mkdir -p "$EVIDENCE_DIR"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: build-log
          path: ${{ env.EVIDENCE_DIR }}
      - name: OIDC gate, verify the signature of the GitHub ID token and the sub condition from oidc/policy.json
        run: |
          set -o pipefail
          OIDC_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -r .aud oidc/policy.json)" | jq -r .value)"
          export OIDC_TOKEN
          node scripts/oidc-gate.mjs | tee "$EVIDENCE_DIR/oidc.txt"
      - name: Application secrets of this short-lived environment (the vault serves real ones)
        run: |
          put() { echo "::add-mask::$2"; echo "$1=$2" >> "$GITHUB_ENV"; }
          broker="$(openssl rand -hex 16)"
          put DB_PASSWORD "$(openssl rand -hex 16)"
          put BROKER_URL "amqp://marketplace:$broker@127.0.0.1:5672"
          put REFRESH_TOKEN_PEPPER "$(openssl rand -hex 24)"
          put STORAGE_SECRET_KEY "$(openssl rand -hex 16)"
          put PULUMI_CONFIG_PASSPHRASE "$(openssl rand -hex 16)"
          node scripts/jwt-keys.mjs ci | grep -E '^JWT_(PRIVATE_KEY|PUBLIC_KEYS)=' > keys.env
          while IFS='=' read -r name value; do put "$name" "$value"; done < keys.env
          rm keys.env
          echo "JWT_KID=ci" >> "$GITHUB_ENV"
          echo "STORAGE_ACCESS_KEY=marketplace" >> "$GITHUB_ENV"
      - name: Pulumi CLI
        run: |
          command -v pulumi || { curl -fsSL https://get.pulumi.com | sh; echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"; }
      - name: One kind cluster, the image goes into it by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kind create cluster --name marketplace --config k8s/kind-config.yaml --wait 120s
          docker exec -e CREDS="${{ github.actor }}:$REGISTRY_TOKEN" marketplace-control-plane \
            sh -c 'crictl pull --creds "$CREDS" "$0"' "$IMAGE_BY_DIGEST"
          bash scripts/pulumi.sh config set image "$IMAGE_BY_DIGEST"
          bash scripts/pulumi.sh config set rev "${{ inputs.digest }}"
      - name: pulumi preview --json, the plan that feeds the cost gate
        run: bash scripts/pulumi.sh preview --json > "$EVIDENCE_DIR/plan.json"
      - name: Cost gate
        env:
          PLAN_JSON: ${{ env.EVIDENCE_DIR }}/plan.json
          COST_APPROVED: ${{ inputs.cost-approved }}
        run: |
          npm run gate:cost || { [ "$COST_APPROVED" = "true" ] && echo "cost gate failed, bypassed by the label"; }
      - name: pulumi up
        run: npm run up
      - name: The manifest that went into the cluster
        run: |
          kubectl --context kind-marketplace -n marketplace rollout status deployment/marketplace-api --timeout=300s
          kubectl --context kind-marketplace -n marketplace get deploy marketplace-api -o json > "$EVIDENCE_DIR/deployment.json"
      - name: Rollout gate, a new revision under load must not fail a single request
        run: |
          set -o pipefail
          npm run demo:rollout | tee "$EVIDENCE_DIR/rollout.txt"
      - name: Evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ inputs.head-sha }}
          IMAGE_REF: ${{ inputs.image-ref }}
          BUILT_DIGEST: ${{ inputs.digest }}
          GATE_SCAN_EXIT: ${{ inputs.gate-scan-exit }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/pipeline-evidence.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.evidence-name }}
          path: |
            ${{ env.EVIDENCE_DIR }}/evidence.txt
            ${{ env.EVIDENCE_DIR }}/deployment.json
            ${{ env.EVIDENCE_DIR }}/plan.json
            ${{ env.EVIDENCE_DIR }}/rollout.txt
            ${{ env.EVIDENCE_DIR }}/build.log
