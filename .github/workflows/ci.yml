name: ci

on: [push, pull_request]

jobs:
  db:
    runs-on: ubuntu-latest
    env:
      SKIP_VAULT: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '6432'
      DB_USER: marketplace_a
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'marketplace_dev' }}
      DB_NAME: marketplace
      BROKER_PASSWORD: ${{ secrets.BROKER_PASSWORD || 'marketplace_dev' }}
      BROKER_URL: amqp://marketplace:${{ secrets.BROKER_PASSWORD || 'marketplace_dev' }}@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose up -d --wait postgres pgbouncer rabbitmq
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
      - run: npm run check:indexes
      - run: npm run seed && npm run seed
      - run: npm run demo:race
      - run: npm run demo:workers
      - run: npm run demo:retry
      - run: npm run demo:publish
      - run: npm run demo:dlq
      - run: npm run demo:duplicate
      - run: bash scripts/with-secrets.sh dev bash scripts/backup.sh
      - run: bash scripts/with-secrets.sh dev bash scripts/restore-drill.sh
      - run: npx redocly lint openapi/openapi.yaml

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:e2e

  contract:
    runs-on: ubuntu-latest
    env:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL || 'http://127.0.0.1:9292' }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the compose Pact Broker when no external broker is configured
        if: env.PACT_BROKER_URL == 'http://127.0.0.1:9292'
        run: docker compose up -d --wait pact-broker
      - name: Generate the consumer contract
        run: npm run test:contract
      - name: Publish the contract
        run: bash scripts/pact-broker.sh publish
      - name: Verify the provider and publish the result
        run: npm run verify:provider
      - name: Gate, can the provider go to prod
        run: bash scripts/pact-broker.sh can-i-deploy marketplace-api
      - name: Deploy the provider and record the deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/pact-broker.sh record-deployment marketplace-api
      - name: Gate, can the consumer go to prod
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/pact-broker.sh can-i-deploy marketplace-web
      - name: Deploy the consumer and record the deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/pact-broker.sh record-deployment marketplace-web
