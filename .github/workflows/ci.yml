name: ci

on: [push, pull_request]

jobs:
  db:
    runs-on: ubuntu-latest
    env:
      SKIP_VAULT: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '6432'
      DB_USER: marketplace_a
      DB_PASSWORD: marketplace_dev
      DB_NAME: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
      - run: npm run check:indexes
      - run: npm run seed && npm run seed
      - run: npm run demo:race
      - run: npm run demo:workers
      - run: npm run demo:retry
      - run: bash scripts/with-secrets.sh dev bash scripts/backup.sh
      - run: bash scripts/with-secrets.sh dev bash scripts/restore-drill.sh
      - run: npm run test:pact
      - run: npx redocly lint openapi/openapi.yaml
