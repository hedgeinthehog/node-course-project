name: marketplace-localstack

services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - '127.0.0.1:23166:4566'
    environment:
      ENFORCE_IAM: '1'
    volumes:
      # Lambda functions run in sibling containers; without the socket a function never becomes
      # active and cannot even be deleted.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:4566/_localstack/health']
      interval: 2s
      timeout: 3s
      retries: 30
